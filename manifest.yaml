description: 使用用户指定的商品编辑页、商家规则和浏览器环境，按规格、图文、物流、售后整理可见字段的缺项、冲突与人工补充表。不可见字段明确留空，未提供规则不虚构要求；全程默认只读，不保存、不提交、不上架，交付结果保留每条资料来源与处理边界。
